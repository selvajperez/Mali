<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUTE - Prueba de carga</title>
</head>
<body>
  <h1>MUTE</h1>
  <button id="upload_widget">Subir foto</button>

  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

  <script>
    const widget = cloudinary.createUploadWidget(
      {
        cloudName: "srxrmckc",
        uploadPreset: "mute-products"
      },
      (error, result) => {
        if (!error && result && result.event === "success") {
          console.log("Imagen subida:", result.info.secure_url);
          document.body.insertAdjacentHTML(
            "beforeend",
            `<p>URL: ${result.info.secure_url}</p>
             <img src="${result.info.secure_url}" style="max-width:300px;">`
          );
        }
      }
    );

    document
      .getElementById("upload_widget")
      .addEventListener("click", () => widget.open());
  </script>
</body>
</html>
